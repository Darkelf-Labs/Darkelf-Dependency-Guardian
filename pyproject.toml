[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkelf-dependency-guardian"
version = "0.1.0"
description = "Framework-aware dependency compatibility analysis and safe update recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"

authors = [
    { name = "Darkelf Labs" }
]

dependencies = [
    "packaging>=24.0",
]

[project.scripts]
guardian = "guardian:main"

[tool.setuptools]
include-package-data = true

py-modules = [
    "guardian",
    "config",
    "logger",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core",
    "core.*",
]

[tool.setuptools.package-data]
"*" = [
    "rules/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
