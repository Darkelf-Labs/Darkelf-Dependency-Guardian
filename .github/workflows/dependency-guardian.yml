
name: Darkelf Dependency Guardian

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: darkelf-guardian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guardian:
    name: Dependency Compatibility Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Dependency Guardian
        uses: actions/checkout@v5
        with:
          path: guardian

      - name: Checkout Darkelf Web Browser
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Web-Browser
          ref: main
          path: browser

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: guardian/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Install Dependency Guardian
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./guardian

      - name: Verify Guardian Installation
        run: guardian --help

      - name: Install Browser Dependencies
        working-directory: browser
        run: npm ci

      - name: Validate Browser Project
        working-directory: browser
        run: guardian validate

      - name: Scan Browser Dependencies
        working-directory: browser
        run: guardian scan

      - name: Analyze Compatibility
        working-directory: browser
        run: guardian compatibility

      - name: Dependency Health Check
        working-directory: browser
        run: guardian doctor

      - name: Generate Dependency Reports
        if: success() || failure()
        working-directory: browser
        run: guardian report

      - name: Upload Guardian Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkelf-guardian-reports
          path: |
            browser/.guardian/
            browser/reports/
          if-no-files-found: warn
          retention-days: 30
