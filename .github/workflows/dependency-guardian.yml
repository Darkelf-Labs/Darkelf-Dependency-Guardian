name: Darkelf Dependency Guardian
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: python3 guardian.py
